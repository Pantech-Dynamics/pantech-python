            `SERVICE_UNAVAILABLE`: request quota storage is unavailable. Wait a few seconds, then retry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /public/v1/kubernetes-moves/{move_id}/cancel:
    post:
      tags:
        - Migrate
      summary: Cancel a Kubernetes move
      description: |-
        Stops the move, removes its copy pods on both clusters, its staged data and its export. Objects already applied to your Pantech cluster stay. Owners and admins only.

        **Scope:** `write`.
      operationId: cancelKubernetesMove
      security:
        - apiKey: []
      x-scope: write
      x-order: 497
      parameters:
        - name: move_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: The move.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: This request's id.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KubernetesMove"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`KUBERNETES_MOVE_NOT_FOUND`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "`KUBERNETES_MOVE_INVALID_STATE`, `IDEMPOTENCY_CONFLICT`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: |-
            `MIGRATE_UNAVAILABLE`: Pantech Migrate is not available on this deployment yet. Try again later.
            `SERVICE_UNAVAILABLE`: request quota storage is unavailable. Wait a few seconds, then retry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /public/v1/kubernetes-moves/{move_id}/manifests:
    get:
      tags:
        - Migrate
      summary: Download the moved manifests
      description: |-
        The transformed manifests as one YAML file, for GitOps. Secret values are never included: the file lists the Secrets the move carries by name.

        **Scope:** `read`.
      operationId: downloadKubernetesMoveManifests
      security:
        - apiKey: []
      x-scope: read
      x-order: 498
      parameters:
        - name: move_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: This request's id.
              schema:
                type: string
            Content-Disposition:
              description: attachment; filename="<move id>.yaml"
              schema:
                type: string
          content:
            application/yaml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`KUBERNETES_MOVE_NOT_FOUND`, `KUBERNETES_MOVE_MANIFESTS_NOT_READY`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: |-
            `MIGRATE_UNAVAILABLE`: Pantech Migrate is not available on this deployment yet. Try again later.
            `SERVICE_UNAVAILABLE`: request quota storage is unavailable. Wait a few seconds, then retry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    CloudAgentSetup:
      type:
        - object
        - "null"
      description: How to run the Pantech Migrate agent; null for federated providers.
      required:
        - image
        - download_url
        - api_url
        - token_variables
        - token_how_to
        - enroll_command
        - run_command
        - container_command
      properties:
        image:
          type: string
          description: The agent's container image.
        download_url:
          type:
            - string
            - "null"
          description: Where the agent's binaries are published.
        api_url:
          type: string
        token_variables:
          type: array
          description: The environment variables the agent reads your read-only credential from, on your machine. It is never sent to Pantech.
          items:
            type: string
        token_how_to:
          type: string
        enroll_command:
          type: string
          description: Contains `<ENROLLMENT_CODE>` where the one-time code goes.
        run_command:
          type: string
        container_command:
          type: string
    CloudAgentStatus:
      type:
        - object
        - "null"
      description: The connection's enrolled agent; null when none is.
      required:
        - id
        - online
        - agent_version
        - platform
        - enrolled_at
        - last_seen_at
        - credential_expires_at
      properties:
        id:
          type: string
        online:
          type: boolean
          description: Whether it polled in the last 2 minutes.
        agent_version:
          type: string
        platform:
          type: string
        enrolled_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        credential_expires_at:
          type: string
          format: date-time
    CloudGCPFederation:
      type:
        - object
        - "null"
      description: What the Google Cloud setup printed.
      required:
        - project_number
        - pool_id
        - provider_id
        - service_account_email
        - project_ids
      properties:
        project_number:
          type: string
        pool_id:
          type: string
        provider_id:
          type: string
        service_account_email:
          type: string
        project_ids:
          type: array
          description: The projects to scan, 1 to 20.
          items:
            type: string
    CloudAzureFederation:
      type:
        - object
        - "null"
      description: What the Azure setup printed.
      required:
        - tenant_id
        - client_id
        - subscription_ids
      properties:
        tenant_id:
          type: string
        client_id:
          type: string
          description: The app registration's application (client) ID.
        subscription_ids:
          type: array
          description: The subscriptions to scan, 1 to 20.
          items:
            type: string
    CloudHuaweiFederation:
      type:
        - object
        - "null"
      description: Your Huawei Cloud identity provider and the projects to scan.
      required:
        - identity_provider_id
        - projects
      properties:
        identity_provider_id:
          type: string
        projects:
          type: array
          description: 1 to 20 region projects.
          items:
            type: object
            required:
              - region
              - id
            properties:
              region:
                type: string
              id:
                type: string
    CloudProvider:
      type: object
      required:
        - slug
        - name
        - access
        - cost_readable
        - people_readable
        - available
      properties:
        slug:
          type: string
          enum:
            - aws
            - gcp
            - azure
            - huawei
            - digitalocean
            - hetzner
            - linode
            - vultr
            - contabo
            - openstack
        name:
          type: string
        access:
          type: string
          enum:
            - federated
            - agent
        cost_readable:
          type: boolean
          description: Whether a scan reads the source's spend. When false the comparison says the spend is not available.
        people_readable:
          type: boolean
          description: Whether a scan lists the people with access. When false, add them to the plan by hand.
        available:
          type: boolean
          description: Whether this deployment can connect it now.
    CloudAgentEnrollment:
      type: object
      required:
        - code
        - expires_at
        - enroll_command
      properties:
        code:
          type: string
          description: The one-time enrollment code, shown only now. It works once, for an hour.
        expires_at:
          type: string
          format: date-time
        enroll_command:
          type: string
    SendMigrationInvitesRequest:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          description: "The `user` items to invite, by key: 1 to 50."
          items:
            type: string
    MigrationInviteResult:
      type: object
      required:
        - key
        - email
        - role
        - outcome
        - reason
        - invite_id
      properties:
        key:
          type: string
        email:
          type:
            - string
            - "null"
        role:
          type:
            - string
            - "null"
        outcome:
          type: string
          description: "`invited`; `already_invited` (from this plan or by hand); `already_member`; `role_not_allowed` (an admin can't invite an admin: change the person's role to member or ask an owner); `skipped` (see reason); `failed` (try again)."
          enum:
            - invited
            - already_invited
            - already_member
            - role_not_allowed
            - skipped
            - failed
        reason:
          type:
            - string
            - "null"
          description: "Why a person was skipped: `email_missing`, `excluded`, `not_a_person`, `unknown_item`."
        invite_id:
          type:
            - string
            - "null"
    MigrationInvites:
      type: object
      required:
        - results
        - migration
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/MigrationInviteResult"
        migration:
          $ref: "#/components/schemas/Migration"
    CloudProviderList:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CloudProvider"
        next_cursor:
          type:
            - string
            - "null"
          description: "Always null: this list is returned whole."
    BucketImportFailure:
      type:
        - object
        - "null"
      description: Why it failed; null when it didn't. `message` says what to do.
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    CopyAccessRequest:
      type: object
      additionalProperties: false
      properties:
        buckets:
          type: array
          description: The source buckets Pantech may copy, 1 to 50, each once. Required the first time.
          items:
            type: string
          maxItems: 50
        role_arn:
          type: string
          description: The copy stack's `CopyRoleArn` output. Setting it queues a verification.
        retry:
          type: boolean
          description: Verify the role again.
    CopyAccessBucket:
      type: object
      required:
        - name
        - region
        - versioning
        - ready
        - failure
      properties:
        name:
          type: string
        region:
          type:
            - string
            - "null"
        versioning:
          type:
            - string
            - "null"
          enum:
            - enabled
            - suspended
            - off
            - null
        ready:
          type: boolean
          description: "Verified: an import may copy this bucket."
        failure:
          $ref: "#/components/schemas/BucketImportFailure"
    CopyAccessSetup:
      type: object
      required:
        - issuer_url
        - audience
        - subject
        - template
      properties:
        issuer_url:
          type: string
        audience:
          type: string
        subject:
          type: string
          description: "The copy role's token subject: the connection id followed by `:copy`."
        template:
          type:
            - string
            - "null"
          description: The CloudFormation template (JSON text) for a role that may read only the chosen buckets; null until buckets are chosen.
    CopyAccess:
      type: object
      required:
        - connection_id
        - status
        - failure
        - role_arn
        - buckets
        - verified_at
        - setup
      properties:
        connection_id:
          type: string
        status:
          type: string
          enum:
            - not_requested
            - awaiting_role
            - verifying
            - verified
            - failed
        failure:
          $ref: "#/components/schemas/BucketImportFailure"
        role_arn:
          type:
            - string
            - "null"
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/CopyAccessBucket"
        verified_at:
          type:
            - string
            - "null"
          format: date-time
        setup:
          $ref: "#/components/schemas/CopyAccessSetup"
    ResyncBucketImportRequest:
      type: object
      additionalProperties: false
      properties:
        mirror_deletes:
          type: boolean
          description: Off unless set. After this pass has listed the whole source, delete the objects this import copied that the source no longer has, and only those still holding the bytes the import wrote. Objects the import did not write are never deleted. Needs the delete scope.
    StartBucketImportRequest:
      type: object
      additionalProperties: false
      required:
        - connection_id
        - source_bucket
      properties:
        connection_id:
          type: string
        source_bucket:
          type: string
          description: The source bucket's name. It must have verified copy access.
        destination_bucket_name:
          type: string
          description: A new Pantech bucket to make and copy into.
        destination_bucket_id:
          type: string
          description: An existing Pantech bucket of the organization to copy into.
        versioning:
          type: boolean
          description: Versioning on a new bucket.
        public_read:
          type: boolean
          description: Make a new bucket publicly readable. Off unless asked, even when the source was public.
        migration_id:
          type: string
          description: The plan the move belongs to; its size for the bucket is checked against the storage left.
    BucketImportProgress:
      type: object
      required:
        - objects_copied
        - objects_skipped
        - objects_failed
        - bytes_copied
        - bytes_skipped
      properties:
        objects_copied:
          type: integer
        objects_skipped:
          type: integer
          description: Already in the Pantech bucket unchanged.
        objects_failed:
          type: integer
        bytes_copied:
          type: integer
        bytes_skipped:
          type: integer
    BucketImportObjectFailure:
      type: object
      required:
        - key
        - reason
        - message
        - at
      properties:
        key:
          type: string
        reason:
          type: string
          enum:
            - object_archived
            - object_access_denied
            - invalid_key
            - object_too_large
            - source_changed
            - verification_failed
            - transfer_failed
            - destination_rejected
        message:
          type: string
        at:
          type: string
          format: date-time
    BucketImportEvent:
      type: object
      required:
        - action
        - actor_user_id
        - detail
        - occurred_at
      properties:
        action:
          type: string
          enum:
            - started
            - cancel_requested
            - resync_requested
            - succeeded
            - failed
            - cancelled
            - mirror_deleted
            - mirror_skipped
        actor_user_id:
          type:
            - string
            - "null"
          description: Null for Pantech's own steps.
        detail:
          type:
            - string
            - "null"
        occurred_at:
          type: string
          format: date-time
    BucketImport:
      type: object
      required:
        - id
        - connection_id
        - migration_id
        - source
        - destination
        - status
        - failure
        - cancel_requested
        - pass
        - progress
        - total_bytes_copied
        - mirror_deletes
        - objects_deleted
        - next_attempt_at
        - created_at
        - started_at
        - finished_at
        - updated_at
        - failures
        - events
      properties:
        id:
          type: string
        connection_id:
          type: string
        migration_id:
          type:
            - string
            - "null"
        source:
          type: object
          required:
            - provider
            - bucket
            - region
          properties:
            provider:
              type: string
            bucket:
              type: string
            region:
              type:
                - string
                - "null"
        destination:
          type: object
          required:
            - bucket_id
            - bucket_name
            - public_read
          properties:
            bucket_id:
              type: string
            bucket_name:
              type: string
            public_read:
              type: boolean
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - cancelled
        failure:
          $ref: "#/components/schemas/BucketImportFailure"
        cancel_requested:
          type: boolean
        pass:
          type: integer
          description: 1 for the first copy; each resync adds one.
        progress:
          $ref: "#/components/schemas/BucketImportProgress"
        total_bytes_copied:
          type: integer
          description: Bytes copied over every pass.
        mirror_deletes:
          type: boolean
          description: The current pass was asked to delete what this import copied and the source no longer has.
        objects_deleted:
          type: integer
          description: Objects deleted by mirror passes, over every pass.
        next_attempt_at:
          type:
            - string
            - "null"
          format: date-time
          description: When a queued import waiting on an unreachable side is tried again.
        created_at:
          type: string
          format: date-time
        started_at:
          type:
            - string
            - "null"
          format: date-time
        finished_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type: string
          format: date-time
        failures:
          type:
            - array
            - "null"
          description: The first 100 objects that failed this pass; null in a list.
          items:
            $ref: "#/components/schemas/BucketImportObjectFailure"
        events:
          type:
            - array
            - "null"
          description: The audit trail; null in a list.
          items:
            $ref: "#/components/schemas/BucketImportEvent"
    BucketImportList:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BucketImport"
        next_cursor:
          type:
            - string
            - "null"
          description: "Always null: this list is returned whole."
    MigrationBucketTarget:
      type:
        - object
        - "null"
      description: The Pantech bucket a bucket item becomes; null for every other kind.
      required:
        - name
        - region
        - versioning
        - public_read
        - size_bytes
        - object_count
        - size_as_of
      properties:
        name:
          type:
            - string
            - "null"
          description: A valid Pantech bucket name made from the source's; null when none could be made.
        region:
          type: string
        versioning:
          type: boolean
        public_read:
          type: boolean
          description: The source bucket was public. The Pantech bucket stays private unless the copy asks.
        size_bytes:
          type:
            - integer
            - "null"
          description: The source's own daily metric, read by the scan; null when unknown.
        object_count:
          type:
            - integer
            - "null"
          description: The source's own daily metric, read by the scan; null when unknown.
        size_as_of:
          type:
            - string
            - "null"
          format: date
          description: 'The day (YYYY-MM-DD) the size and object count describe: show them as "as of" this day.'
    StartServerCopyRequest:
      type: object
      additionalProperties: false
      required:
        - item_key
      properties:
        item_key:
          type: string
          description: The planned server's item key.
        source:
          type: string
          enum:
            - agent
            - aws_snapshot
          default: agent
        name:
          type: string
          description: The new instance's name; the source's when empty.
        plan_slug:
          type: string
          description: Overrides the item's plan.
        subnet_id:
          type: string
        security_group_id:
          type: string
        ssh_key_id:
          type: string
          description: Optional. The copied disk keeps its own users and keys.
        aws:
          $ref: "#/components/schemas/ServerCopyAWSSource"
    ServerCopyAWSSource:
      type: object
      additionalProperties: false
      required:
        - copy_role_arn
      properties:
        copy_role_arn:
          type: string
          description: The copy stack's CopyRoleArn output, never the discover role.
        create_snapshots:
          type: boolean
          description: The copy role may snapshot the server's volumes itself.
        snapshots:
          type: object
          additionalProperties:
            type: string
          description: The first pass's snapshot for each volume id, tagged pantech-migrate-connection.
    ServerCopyActRequest:
      type: object
      additionalProperties: false
      properties:
        snapshots:
          type: object
          additionalProperties:
            type: string
          description: The next pass's snapshot for each volume id, for an AWS copy that makes none itself.
    ServerCopyTemplate:
      type: object
      required:
        - template
        - snapshot_tag
      properties:
        template:
          type: string
          description: CloudFormation JSON.
        snapshot_tag:
          type: object
          additionalProperties:
            type: string
    ServerCopyList:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ServerCopy"
        next_cursor:
          type:
            - string
            - "null"
          description: "Always null: this list is returned whole."
    ServerCopy:
      type: object
      required:
        - id
        - migration_id
        - item_key
        - connection_id
        - source
        - status
        - os_family
        - instance
        - disks
        - flags
        - progress
        - expires_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: "`sco_…`"
        migration_id:
          type: string
        item_key:
          type: string
        connection_id:
          type: string
        source:
          type: string
          enum:
            - agent
            - aws_snapshot
        status:
          type: string
          enum:
            - waiting
            - copying
            - synced
            - importing
            - creating_instance
            - completed
            - failed
            - cancelled
        failure:
          type:
            - object
            - "null"
          properties:
            code:
              type: string
            message:
              type: string
        os_family:
          type: string
          enum:
            - linux
            - windows
        boot_mode:
          type:
            - string
            - "null"
          enum:
            - bios
            - uefi
            - null
        instance:
          type: object
          properties:
            name:
              type: string
            plan_slug:
              type: string
            region:
              type: string
            subnet_id:
              type:
                - string
                - "null"
            security_group_id:
              type:
                - string
                - "null"
            ssh_key_id:
              type:
                - string
                - "null"
            id:
              type:
                - string
                - "null"
              description: Set once the instance is being created.
            order_id:
              type:
                - string
                - "null"
        disks:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              role:
                type: string
                enum:
                  - root
                  - data
              source:
                type: string
              size_bytes:
                type: integer
                format: int64
              snapshot_id:
                type:
                  - string
                  - "null"
              volume_id:
                type:
                  - string
                  - "null"
        flags:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              blocking:
                type: boolean
              message:
                type: string
        pass:
          type:
            - object
            - "null"
          properties:
            number:
              type: integer
            kind:
              type: string
              enum:
                - full
                - delta
                - final
            started_at:
              type:
                - string
                - "null"
              format: date-time
        pending_pass:
          type:
            - string
            - "null"
          enum:
            - full
            - delta
            - final
            - null
        progress:
          type: object
          properties:
            chunks_total:
              type: integer
              format: int64
            chunks_done:
              type: integer
              format: int64
            bytes_total:
              type: integer
              format: int64
            bytes_uploaded:
              type: integer
              format: int64
            wire_bytes:
              type: integer
              format: int64
            eta_seconds:
              type:
                - integer
                - "null"
              format: int64
        synced_at:
          type:
            - string
            - "null"
          format: date-time
        expires_at:
          type: string
          format: date-time
        completed_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    StartDatabaseImportRequest:
      type: object
      required:
        - item_key
        - destination_database_id
        - source_ref
      properties:
        item_key:
          type: string
          description: "The plan item's key: one of the migration's `database` items."
          example: database:us-east-1:orders
        destination_database_id:
          type: string
          description: "One of your Pantech databases with the same engine as the source. Create it first: it bills as usual; the move itself is free."
          example: db_01JD0000000000000000000000
        target_database:
          type: string
          description: "The database to create and fill on the destination; it must be empty. Defaults to the source's name, made a valid name: 1 to 63 lowercase letters, digits and underscores, starting with a letter."
          example: orders
        mode:
          type: string
          enum:
            - dump
            - replicate
          description: "`dump` copies once (stop writes to the source first). `replicate` keeps following the source's changes until you cut over (PostgreSQL sources only)."
        source_ref:
          type: string
          description: The source's name in your Migrate agent's configuration, 1 to 64 of letters, digits, `.`, `_` and `-`. Its address and login stay on the agent and are never sent to Pantech.
          example: prod-db
    DatabaseImport:
      type: object
      required:
        - id
        - migration_id
        - item_key
        - destination_database_id
        - target_database
        - mode
        - source_ref
        - engine
        - status
        - failure
        - cutover_requested
        - cancel_requested
        - readiness_requested
        - access_revoked
        - agent_connected
        - lag_bytes
        - position
        - readiness
        - destination
        - tables
        - charged
        - version
        - created_at
        - updated_at
        - finished_at
      properties:
        id:
          type: string
        migration_id:
          type: string
        item_key:
          type: string
        destination_database_id:
          type: string
        target_database:
          type: string
        mode:
          type: string
          enum:
            - dump
            - replicate
        source_ref:
          type: string
        engine:
          type: string
          enum:
            - postgres
            - mysql
            - mariadb
          description: The source's engine family.
        status:
          type: string
          enum:
            - awaiting_agent
            - preflight
            - ready
            - blocked
            - copying
            - replicating
            - cutting_over
            - verifying
            - verifying_failed
            - completed
            - cancelling
            - cancelled
            - failed
        failure:
          $ref: "#/components/schemas/DatabaseImportFailure"
        cutover_requested:
          type: boolean
        cancel_requested:
          type: boolean
        readiness_requested:
          type: boolean
          description: A new pre-flight was asked for and the agent has not run it yet.
        access_revoked:
          type: boolean
          description: The import login and its loopback-only access were removed from the destination.
        agent_connected:
          type: boolean
          description: A Migrate agent holds this import now.
        lag_bytes:
          type:
            - integer
            - "null"
          description: Replication lag in bytes of source WAL not yet applied; null in a dump or before replication starts.
        position:
          type:
            - string
            - "null"
          description: The last applied source position (replicate only).
        readiness:
          $ref: "#/components/schemas/DatabaseImportReadiness"
        destination:
          $ref: "#/components/schemas/DatabaseImportDestination"
        tables:
          type:
            - array
            - "null"
          description: Per-table progress; null in a list.
          items:
            $ref: "#/components/schemas/DatabaseImportTable"
        charged:
          type: boolean
          description: "Always false: moving data is free. The destination database bills as usual."
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        finished_at:
          type:
            - string
            - "null"
          format: date-time
    DatabaseImportFailure:
      type:
        - object
        - "null"
      description: Why the import stopped; null while it has not.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: "`statement_refused`, `chunk_invalid`, `access_revoked`, `destination_unavailable`, or one the agent reported: `source_unreachable`, `source_auth_failed`, `source_permission_denied`, `source_not_configured`, `dump_tool_missing`, `source_changed`, `internal`."
        message:
          type: string
    DatabaseImportReadiness:
      type:
        - object
        - "null"
      description: The latest pre-flight; null until the agent ran one.
      required:
        - checked_at
        - blocked
        - issues
        - source
      properties:
        checked_at:
          type: string
          format: date-time
        blocked:
          type: boolean
          description: A blocking issue stops the import until it is fixed and readiness is checked again.
        issues:
          type: array
          items:
            $ref: "#/components/schemas/DatabaseImportIssue"
        source:
          $ref: "#/components/schemas/DatabaseImportSource"
    DatabaseImportIssue:
      type: object
      required:
        - code
        - blocking
        - message
        - fix
        - subject
      properties:
        code:
          type: string
          description: For example `source_version_newer`, `extension_unavailable`, `size_exceeds_storage`, `size_not_measured`, `table_without_primary_key`, `replication_check_failed`, `mode_not_available`, `target_not_empty`, `destination_not_ready`, `destination_not_supported`.
        blocking:
          type: boolean
        message:
          type: string
        fix:
          type:
            - string
            - "null"
          description: A copy-paste fix for the source's provider (an RDS parameter group setting, a Cloud SQL flag, an Azure server parameter, SQL).
        subject:
          type:
            - string
            - "null"
          description: What the issue is about (an extension, tables, a check).
    DatabaseImportSource:
      type: object
      description: What the Migrate agent measured on the source. Numbers it could not measure are null, never estimated.
      required:
        - engine
        - version
        - provider
        - database
        - size_bytes
        - extensions
        - table_count
      properties:
        engine:
          type: string
        version:
          type:
            - string
            - "null"
        provider:
          type:
            - string
            - "null"
          description: "`aws_rds`, `gcp_cloudsql`, `azure`, `digitalocean` or `self_hosted`, as the agent detected it."
        database:
          type:
            - string
            - "null"
        size_bytes:
          type:
            - integer
            - "null"
        extensions:
          type: array
          items:
            type: string
        table_count:
          type: integer
    DatabaseImportDestination:
      type:
        - object
        - "null"
      description: What your Pantech database reported over the import's own connection; null in a list. Numbers are null until measured.
      required:
        - access_state
        - measured
        - engine
        - server_version
        - disk_available_bytes
        - disk_total_bytes
        - target_tables
        - trusted_extensions
      properties:
        access_state:
          type: string
          enum:
            - not_prepared
            - requested
            - active
            - revoking
            - revoked
            - failed
          description: The import login's state on the destination.
        measured:
          type: boolean
        engine:
          type:
            - string
            - "null"
        server_version:
          type:
            - string
            - "null"
        disk_available_bytes:
          type:
            - integer
            - "null"
        disk_total_bytes:
          type:
            - integer
            - "null"
        target_tables:
          type:
            - integer
            - "null"
          description: Tables already in the target database; an import needs an empty one.
        trusted_extensions:
          type: array
          items:
            type: string
    DatabaseImportTable:
      type: object
      required:
        - schema
        - name
        - has_primary_key
        - status
        - pages_copied
        - rows_copied
        - bytes_copied
        - verification
        - updated_at
      properties:
        schema:
          type:
            - string
            - "null"
        name:
          type: string
        has_primary_key:
          type: boolean
        status:
          type: string
          enum:
            - pending
            - copying
            - copied
            - verified
            - verify_failed
        pages_copied:
          type: integer
        rows_copied:
          type: integer
        bytes_copied:
          type: integer
        verification:
          $ref: "#/components/schemas/DatabaseImportVerification"
        updated_at:
          type: string
          format: date-time
    DatabaseImportVerification:
      type:
        - object
        - "null"
      description: The table's comparison; null until it was verified.
      required:
        - source_rows
        - destination_rows
        - samples_checked
        - mismatched_samples
        - passed
      properties:
        source_rows:
          type: integer
        destination_rows:
          type: integer
        samples_checked:
          type: integer
          description: Key ranges whose rows were checksummed on both sides.
        mismatched_samples:
          type: integer
        passed:
          type: boolean
    DatabaseImportList:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DatabaseImport"
        next_cursor:
          type:
            - string
            - "null"
          description: "Always null: this list is returned whole."
    KubernetesMoveFailure:
      type:
        - object
