            type: string
      responses:
        "200":
          description: The import.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: This request's id.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BucketImport"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`BUCKET_IMPORT_NOT_FOUND`: no bucket import with this id exists in your organization."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: |-
            `MIGRATE_UNAVAILABLE`: Pantech Migrate is not available on this deployment yet. Try again later.
            `SERVICE_UNAVAILABLE`: request quota storage is unavailable. Wait a few seconds, then retry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /public/v1/bucket-imports/{import_id}/cancel:
    post:
      tags:
        - Migrate
      summary: Cancel a bucket import
      description: |-
        Stops the import: a queued one at once, a running one at its next checkpoint. Uploads in flight are abandoned; objects already copied stay. Owners and admins only.

        **Scope:** `write`.
      operationId: cancelBucketImport
      security:
        - apiKey: []
      x-scope: write
      x-order: 167
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: import_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: The import.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: This request's id.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BucketImport"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`BUCKET_IMPORT_NOT_FOUND`: no bucket import with this id exists in your organization."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "`BUCKET_IMPORT_FINISHED`: the import has already finished."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: |-
            `MIGRATE_UNAVAILABLE`: Pantech Migrate is not available on this deployment yet. Try again later.
            `SERVICE_UNAVAILABLE`: request quota storage is unavailable. Wait a few seconds, then retry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /public/v1/bucket-imports/{import_id}/resync:
    post:
      tags:
        - Migrate
      summary: Resync a bucket import
      description: |-
        Queues another pass over the source. Objects Pantech already holds unchanged are skipped, so it copies only what changed. Run a last resync after writes to the source stop, then switch over. `mirror_deletes: true` (off by default, for that pass only) also deletes the objects this import copied that the source no longer has; it never deletes an object the import did not write, needs the `delete` scope, and is recorded in the import's audit trail. Owners and admins only.

        **Scope:** `write`.
      operationId: resyncBucketImport
      security:
        - apiKey: []
      x-scope: write
      x-order: 167
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: import_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResyncBucketImportRequest"
      responses:
        "202":
          description: The import, queued.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: This request's id.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BucketImport"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`BUCKET_IMPORT_NOT_FOUND`: no bucket import with this id exists in your organization."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "`BUCKET_IMPORT_RUNNING`: the import is still queued or running. `COPY_ACCESS_NOT_READY`: copy access to the bucket was withdrawn. `BUCKET_IMPORT_IN_PROGRESS`: another import of the bucket is open."
          content:
