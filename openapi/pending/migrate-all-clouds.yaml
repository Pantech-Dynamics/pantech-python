# Pending endpoints for Pantech Migrate across clouds: the cloud list, federated
# connections to Google Cloud, Azure and Huawei Cloud, the Migrate agent for
# DigitalOcean, Hetzner, Linode, Vultr, Contabo and OpenStack, plan invites,
# bucket imports with copy access, server copies, database imports and
# Kubernetes moves. Merged only where openapi/public-api.yaml lacks the route or
# schema; delete once the published spec includes them.
paths:
  /public/v1/cloud-providers:
    get:
      tags:
        - Migrate
      summary: List the clouds Migrate can read
      description: |-
        Every cloud Pantech Migrate can connect, how it reads each (`federated`: Pantech signs short-lived tokens your cloud trusts; `agent`: you run the Pantech Migrate agent, which keeps your read-only token on your machine), and whether a scan reads its spend and its people.

        **Scope:** `read`.
      operationId: listCloudProviders
      security:
        - apiKey: []
      x-scope: read
      x-order: 489
      responses:
        "200":
          description: The providers.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: This request's id.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudProviderList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: |-
            `MIGRATE_UNAVAILABLE`: Pantech Migrate is not available on this deployment yet. Try again later.
            `MIGRATE_AGENT_UNAVAILABLE` / `MIGRATE_INVITES_UNAVAILABLE`: this part of Pantech Migrate is not available on this deployment yet.
            `SERVICE_UNAVAILABLE`: request quota storage is unavailable. Wait a few seconds, then retry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /public/v1/cloud-connections/{connection_id}/agent-enrollments:
    post:
      tags:
        - Migrate
      summary: Enroll a Migrate agent
      description: |-
        For a connection read by the Pantech Migrate agent: a one-time enrollment code, shown only in this response, valid once for an hour. Run `enroll_command` where the agent will run. Issuing a code replaces any unused one; redeeming it replaces the connection's earlier agent. Owners and admins only.

        **Idempotency:** not replayed: each call issues a new code.

        **Scope:** `write`.
      operationId: createCloudAgentEnrollment
      security:
        - apiKey: []
      x-scope: write
      x-order: 490
      parameters:
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: The code.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: This request's id.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudAgentEnrollment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`CLOUD_CONNECTION_NOT_FOUND`: no cloud connection with this id exists in your organization."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "`CLOUD_CONNECTION_NOT_AGENT`: Pantech reads this cloud itself; it needs no agent."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: |-
            `MIGRATE_UNAVAILABLE`: Pantech Migrate is not available on this deployment yet. Try again later.
            `MIGRATE_AGENT_UNAVAILABLE` / `MIGRATE_INVITES_UNAVAILABLE`: this part of Pantech Migrate is not available on this deployment yet.
            `SERVICE_UNAVAILABLE`: request quota storage is unavailable. Wait a few seconds, then retry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /public/v1/cloud-connections/{connection_id}/agent:
    delete:
      tags:
        - Migrate
      summary: Revoke a connection's agent
      description: |-
        Ends the connection's Migrate agent at once: its credential stops working on its next request. The connection waits for a new agent. Like disconnecting, this only takes access away. Owners and admins only.

        **Idempotency:** revoking again changes nothing.

        **Scope:** `write`.
      operationId: revokeCloudAgent
      security:
        - apiKey: []
      x-scope: write
      x-order: 491
      parameters:
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The connection.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: This request's id.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudConnection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`CLOUD_CONNECTION_NOT_FOUND`: no cloud connection with this id exists in your organization."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "`CLOUD_CONNECTION_NOT_AGENT`: Pantech reads this cloud itself; it has no agent."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: |-
            `MIGRATE_UNAVAILABLE`: Pantech Migrate is not available on this deployment yet. Try again later.
            `MIGRATE_AGENT_UNAVAILABLE` / `MIGRATE_INVITES_UNAVAILABLE`: this part of Pantech Migrate is not available on this deployment yet.
            `SERVICE_UNAVAILABLE`: request quota storage is unavailable. Wait a few seconds, then retry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /public/v1/migrations/{migration_id}/invites:
    post:
      tags:
        - Migrate
      summary: Invite a plan's people
      description: |-
        Sends Pantech invites to the people a plan lists (items of kind `user`), by key, with each item's role, through the organization's ordinary invite flow: the same email, rules and audit as inviting from Members. An admin can invite members only; a person suggested as admin comes back `role_not_allowed`. Owners and admins only.

        **Idempotency:** safe to repeat: a person already invited from this plan, already holding a pending invite, or already a member is reported and never invited twice.

        **Scope:** `write`.
      operationId: sendMigrationInvites
      security:
        - apiKey: []
      x-scope: write
      x-order: 492
      parameters:
        - name: migration_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMigrationInvitesRequest"
      responses:
        "200":
          description: What happened to each person, and the plan.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: This request's id.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationInvites"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`MIGRATION_NOT_FOUND`: no migration with this id exists in your organization."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "`VALIDATION_FAILED`: `keys` must name 1 to 50 items."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: |-
            `MIGRATE_UNAVAILABLE`: Pantech Migrate is not available on this deployment yet. Try again later.
            `MIGRATE_AGENT_UNAVAILABLE` / `MIGRATE_INVITES_UNAVAILABLE`: this part of Pantech Migrate is not available on this deployment yet.
            `SERVICE_UNAVAILABLE`: request quota storage is unavailable. Wait a few seconds, then retry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /public/v1/cloud-connections/{connection_id}/copy-access:
    get:
      tags:
        - Migrate
      summary: Get copy access
      description: |-
        The connection's opt-in copy access: the buckets chosen for copying, the copy role and what its last verification found, and the CloudFormation template for that role. `status` is `not_requested` until buckets are chosen. The copy role is separate from the connection's read-only role and may read only the chosen buckets' objects.

        **Scope:** `read`.
      operationId: getCopyAccess
      security:
        - apiKey: []
      x-scope: read
      x-order: 167
      parameters:
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The copy access.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: This request's id.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyAccess"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`CLOUD_CONNECTION_NOT_FOUND`: no cloud connection with this id exists in your organization."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: |-
            `MIGRATE_UNAVAILABLE`: Pantech Migrate is not available on this deployment yet. Try again later.
            `SERVICE_UNAVAILABLE`: request quota storage is unavailable. Wait a few seconds, then retry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      tags:
        - Migrate
      summary: Set copy access
      description: |-
        Chooses the buckets Pantech may copy (`buckets`, needed the first time; at most 50) and returns the CloudFormation template for a copy role that may read only those buckets. Create a stack from it (or update the stack when the list changes), then set `role_arn` to its `CopyRoleArn` output; Pantech then verifies the role against each bucket without reading any object. `retry: true` verifies again. Owners and admins only.

        **Scope:** `write`.
      operationId: putCopyAccess
      security:
        - apiKey: []
      x-scope: write
      x-order: 167
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyAccessRequest"
      responses:
        "200":
          description: The copy access.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: This request's id.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyAccess"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`CLOUD_CONNECTION_NOT_FOUND`: no cloud connection with this id exists in your organization."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "`COPY_ACCESS_VERIFYING`: the copy access is still being checked. `CONFLICT`: it changed at the same time."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "`VALIDATION_FAILED`: `buckets` must name 1 to 50 buckets, each once; `role_arn` must be a role in the connected account."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: |-
            `MIGRATE_UNAVAILABLE`: Pantech Migrate is not available on this deployment yet. Try again later.
            `SERVICE_UNAVAILABLE`: request quota storage is unavailable. Wait a few seconds, then retry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /public/v1/bucket-imports:
    get:
      tags:
        - Migrate
      summary: List bucket imports
      description: |-
        The organization's bucket imports, newest first.

        **Scope:** `read`.
      operationId: listBucketImports
      security:
        - apiKey: []
      x-scope: read
      x-order: 167
      responses:
        "200":
          description: Bucket imports.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: This request's id.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BucketImportList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: |-
            `MIGRATE_UNAVAILABLE`: Pantech Migrate is not available on this deployment yet. Try again later.
            `SERVICE_UNAVAILABLE`: request quota storage is unavailable. Wait a few seconds, then retry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags:
        - Migrate
      summary: Copy a bucket into Pantech
      description: |-
        Copies one source bucket's objects into a Pantech bucket: a new one (`destination_bucket_name`, made now and billed as any bucket) or one the organization has (`destination_bucket_id`). The bucket must have verified copy access. Objects stream from the source, are checked against their MD5s, and keep their content type, cache control, content disposition, user metadata and tags; only current versions are copied and nothing is deleted on either side. Follow it with `GET /public/v1/bucket-imports/{import_id}`. Moving is free; stored data bills as usual. Owners and admins only.

        **Scope:** `write`.
      operationId: startBucketImport
      security:
        - apiKey: []
      x-scope: write
      x-order: 167
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartBucketImportRequest"
      responses:
        "202":
          description: The queued import.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: This request's id.
              schema:
                type: string
            Location:
              description: Where the new resource is.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BucketImport"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`FORBIDDEN` or `INSUFFICIENT_SCOPE`: the key may not do this. `BUCKET_IMPORT_LIMIT_REACHED`: 20 imports are already in progress. `BUCKET_IMPORT_TOO_LARGE`: the bucket is larger than the storage your organization has left. `OBJECT_STORAGE_NOT_ENABLED`: object storage is not enabled for your organization. `BUCKET_LIMIT_REACHED`: the organization has the most buckets allowed."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "`CLOUD_CONNECTION_NOT_FOUND`, `MIGRATION_NOT_FOUND` or `BUCKET_NOT_FOUND`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "`COPY_ACCESS_NOT_READY`: grant and verify copy access to this bucket first. `BUCKET_IMPORT_IN_PROGRESS`: the bucket is already being copied. `BUCKET_NAME_TAKEN`: a bucket with that name exists. `CLOUD_CONNECTION_NOT_CONNECTED`, `CLOUD_CONNECTION_VERIFYING` or `IDEMPOTENCY_CONFLICT`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "`VALIDATION_FAILED`: name the source bucket, and exactly one of `destination_bucket_name` (a valid bucket name) and `destination_bucket_id`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: |-
            `MIGRATE_UNAVAILABLE`: Pantech Migrate is not available on this deployment yet. Try again later.
            `SERVICE_UNAVAILABLE`: request quota storage is unavailable. Wait a few seconds, then retry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
