# Pending public API additions for Object Storage (all 37 operations under
# /public/v1/object-storage* and /public/v1/buckets*).
# Merged by scripts/_spec.py only where openapi/public-api.yaml lacks them,
# so a newer vendored spec always wins. Delete once public-api.yaml has them.

paths:
  /public/v1/object-storage:
    get:
      tags:
      - Object storage
      summary: Object storage status
      description: 'Whether object storage is enabled for your organization, and the S3 endpoint to point S3 tools at. Object
        storage is in closed beta: until it is enabled, `enabled` is false and every bucket and key write is refused with
        `OBJECT_STORAGE_NOT_ENABLED`.


        **Scope:** `read`.'
      operationId: getObjectStorage
      security:
      - apiKey: []
      x-scope: read
      x-order: 453
      responses:
        200:
          description: The status.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: This request's id.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectStorageStatus'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          description: '`INSUFFICIENT_SCOPE`: the API key lacks the scope this endpoint needs. Use a key with that scope.

            `FORBIDDEN`: the member who created the key may not do this in the organization. Use a key created by an owner
            or admin.

            `AI_APPS_DISABLED`: the organization has turned AI app access off. An owner can turn it on in the console under
            Organization › AI apps.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        429:
          $ref: '#/components/responses/RateLimited'
        503:
          $ref: '#/components/responses/QuotaUnavailable'
  /public/v1/buckets:
    get:
      tags:
      - Object storage
      summary: List buckets
      description: 'Your organization''s buckets, newest first. Deleted buckets are not listed.


        **Scope:** `read`.'
      operationId: listBuckets
      security:
      - apiKey: []
      x-scope: read
      x-order: 454
      responses:
        200:
          description: Buckets.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: This request's id.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketList'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          description: '`INSUFFICIENT_SCOPE`: the API key lacks the scope this endpoint needs. Use a key with that scope.

            `FORBIDDEN`: the member who created the key may not do this in the organization. Use a key created by an owner
            or admin.

            `AI_APPS_DISABLED`: the organization has turned AI app access off. An owner can turn it on in the console under
            Organization › AI apps.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        429:
          $ref: '#/components/responses/RateLimited'
        503:
          description: '`OBJECT_STORAGE_UNAVAILABLE`: object storage is not available right now. Retry shortly.

            `QUOTA_UNAVAILABLE`: request quotas cannot be checked right now. Retry shortly.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - Object storage
      summary: Create a bucket
      description: 'Creates a bucket. It is usable once `state` is `active`, usually within seconds; follow `operation_id`
        or get the bucket. Objects are reached with any S3 tool at `endpoint` using path-style addressing (`<endpoint>/<bucket>/<key>`)
        and an access key.


        Stored data is billed per GiB-month, measured hourly; an empty bucket costs nothing. Requests and transfer are not
        charged during the beta.


        **Idempotency:** a retry with the same `Idempotency-Key` returns the first bucket.


        **Scope:** `write`.'
      operationId: createBucket
      security:
      - apiKey: []
      x-scope: write
      x-order: 455
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBucketRequest'
      responses:
        201:
          description: The bucket, and the operation creating it.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: This request's id.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedBucket'
        400:
          description: '`IDEMPOTENCY_KEY_REQUIRED`: the `Idempotency-Key` header is missing. Send a new unique value, such
            as a UUID, with every write.

            `INVALID_IDEMPOTENCY_KEY`: the `Idempotency-Key` header is longer than 255 characters. Use a shorter value.

            `INVALID_REQUEST_BODY`: the body is not a single valid JSON object. Send one JSON object with the fields documented
            for this endpoint.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          description: '`INSUFFICIENT_SCOPE`: the API key lacks the scope this endpoint needs. Use a key with that scope.

            `FORBIDDEN`: the member who created the key may not do this in the organization. Use a key created by an owner
            or admin.

            `AI_APPS_DISABLED`: the organization has turned AI app access off. An owner can turn it on in the console under
            Organization › AI apps.

            `OBJECT_STORAGE_NOT_ENABLED`: object storage is in closed beta and not enabled for your organization yet.

            `BUCKET_LIMIT_REACHED`: the organization already has the most buckets allowed.

            `OBJECT_STORAGE_SUSPENDED`: object storage is suspended for this organization.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        409:
          description: '`BUCKET_NAME_TAKEN`: the organization already has a bucket with that name in this region. A deleted
            bucket''s name is free again once its removal finishes.

            `IDEMPOTENCY_CONFLICT`: that idempotency key was already used for a different request.

            `ACCOUNT_SUSPENDED`: the account has an overdue invoice. Pay it under Billing in the console, then try again.

            `ACCOUNT_NOT_ACTIVE`: billing setup is not finished. Finish it under Billing in the console, then try again.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        422:
          description: '`VALIDATION_FAILED`: `name` must be 3 to 63 lowercase letters, digits and hyphens, starting and ending
            with a letter or digit; `quota_bytes` must be 0 or positive; at most 20 `public_prefixes`, each at most 512 characters.

            `OBJECT_STORAGE_REGION_UNAVAILABLE`: object storage is not offered in this region.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        429:
          $ref: '#/components/responses/RateLimited'
        503:
          description: '`OBJECT_STORAGE_UNAVAILABLE`: object storage is not available right now. Retry shortly.

            `QUOTA_UNAVAILABLE`: request quotas cannot be checked right now. Retry shortly.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/v1/buckets/{bucket_id}:
    get:
      tags:
      - Object storage
      summary: Get a bucket
      description: 'One bucket.


        **Scope:** `read`.'
      operationId: getBucket
      security:
      - apiKey: []
      x-scope: read
      x-order: 456
      parameters:
      - name: bucket_id
        in: path
        required: true
        description: The bucket's id, starting `bkt_`.
        schema:
          type: string
      responses:
        200:
          description: The bucket.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: This request's id.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          description: '`INSUFFICIENT_SCOPE`: the API key lacks the scope this endpoint needs. Use a key with that scope.

            `FORBIDDEN`: the member who created the key may not do this in the organization. Use a key created by an owner
            or admin.

            `AI_APPS_DISABLED`: the organization has turned AI app access off. An owner can turn it on in the console under
            Organization › AI apps.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        404:
          description: '`NOT_FOUND`: no bucket with this id exists in your organization. List your buckets to find it.

            `BUCKET_NOT_FOUND`: no bucket with this id exists in your organization.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        429:
          $ref: '#/components/responses/RateLimited'
        503:
          description: '`OBJECT_STORAGE_UNAVAILABLE`: object storage is not available right now. Retry shortly.

            `QUOTA_UNAVAILABLE`: request quotas cannot be checked right now. Retry shortly.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags:
      - Object storage
      summary: Change a bucket
      description: 'Changes only the fields sent: the quota, versioning, or the public prefixes (anyone may read objects under
        them; an empty list makes the bucket wholly private). `state` is `updating` until the change is applied, usually within
        seconds.


        **Idempotency:** a retry with the same `Idempotency-Key` returns the first result.


        **Scope:** `write`.'
      operationId: updateBucket
      security:
      - apiKey: []
      x-scope: write
      x-order: 457
      parameters:
      - name: bucket_id
        in: path
        required: true
        description: The bucket's id, starting `bkt_`.
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBucketRequest'
      responses:
        200:
          description: The bucket.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: This request's id.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatedBucket'
        400:
          description: '`IDEMPOTENCY_KEY_REQUIRED`: the `Idempotency-Key` header is missing. Send a new unique value, such
            as a UUID, with every write.

            `INVALID_IDEMPOTENCY_KEY`: the `Idempotency-Key` header is longer than 255 characters. Use a shorter value.

            `INVALID_REQUEST_BODY`: the body is not a single valid JSON object. Send one JSON object with the fields documented
            for this endpoint.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          description: '`INSUFFICIENT_SCOPE`: the API key lacks the scope this endpoint needs. Use a key with that scope.

            `FORBIDDEN`: the member who created the key may not do this in the organization. Use a key created by an owner
            or admin.

            `AI_APPS_DISABLED`: the organization has turned AI app access off. An owner can turn it on in the console under
            Organization › AI apps.

            `OBJECT_STORAGE_NOT_ENABLED`: object storage is in closed beta and not enabled for your organization yet.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        404:
          description: '`NOT_FOUND`: no bucket with this id exists in your organization. List your buckets to find it.

            `BUCKET_NOT_FOUND`: no bucket with this id exists in your organization.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        409:
          description: '`BUCKET_DELETED`: the bucket has been deleted.

            `IDEMPOTENCY_CONFLICT`: that idempotency key was already used for a different request.

            `CONFLICT`: the bucket changed while the request ran; try again.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        422:
          description: '`VALIDATION_FAILED`: send `quota_bytes`, `versioning`, `public_prefixes` or several; a bucket with
            object lock keeps versioning on.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        429:
          $ref: '#/components/responses/RateLimited'
        503:
          description: '`OBJECT_STORAGE_UNAVAILABLE`: object storage is not available right now. Retry shortly.

            `QUOTA_UNAVAILABLE`: request quotas cannot be checked right now. Retry shortly.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags:
      - Object storage
      summary: Delete a bucket
      description: 'Deletes the bucket at once: it stops serving and billing. Its objects are deleted and cannot be recovered.
        A bucket that still holds objects is refused unless `force` is `true`; one holding objects under object lock is always
        refused.


        **Scope:** `write` (an AI app''s key also needs `delete`).'
      operationId: deleteBucket
      security:
      - apiKey: []
      x-scope: write
      x-destructive: true
      x-order: 458
      parameters:
      - name: bucket_id
        in: path
        required: true
        description: The bucket's id, starting `bkt_`.
        schema:
          type: string
      - name: force
        in: query
        required: false
        description: Delete the bucket even though it holds objects, which are removed with it.
        schema:
          type: boolean
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        202:
          description: The delete was accepted.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: This request's id.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        400:
          description: '`IDEMPOTENCY_KEY_REQUIRED`: the `Idempotency-Key` header is missing. Send a new unique value, such
            as a UUID, with every write.

            `INVALID_IDEMPOTENCY_KEY`: the `Idempotency-Key` header is longer than 255 characters. Use a shorter value.

            `INVALID_REQUEST_BODY`: the body is not a single valid JSON object. Send one JSON object with the fields documented
            for this endpoint.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          description: '`INSUFFICIENT_SCOPE`: the API key lacks the scope this endpoint needs. Use a key with that scope.

            `FORBIDDEN`: the member who created the key may not do this in the organization. Use a key created by an owner
            or admin.

            `AI_APPS_DISABLED`: the organization has turned AI app access off. An owner can turn it on in the console under
            Organization › AI apps.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        404:
          description: '`NOT_FOUND`: no bucket with this id exists in your organization. List your buckets to find it.

            `BUCKET_NOT_FOUND`: no bucket with this id exists in your organization.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        409:
          description: '`BUCKET_NOT_EMPTY`: the bucket still holds objects. Empty it first, or delete it with `force=true`.

            `BUCKET_RETENTION`: the bucket holds objects under object lock, which cannot be deleted before their retention
            ends.

            `IDEMPOTENCY_CONFLICT`: that idempotency key was already used for a different request.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        422:
          description: '`VALIDATION_FAILED`: `force` must be `true` or `false`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        429:
          $ref: '#/components/responses/RateLimited'
        503:
          description: '`OBJECT_STORAGE_UNAVAILABLE`: object storage is not available right now. Retry shortly.

            `QUOTA_UNAVAILABLE`: request quotas cannot be checked right now. Retry shortly.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/v1/object-storage/keys:
    get:
      tags:
      - Object storage
      summary: List access keys
      description: 'Your organization''s object storage access keys that are not revoked, newest first. The secret is shown
        only when a key is created.


        **Scope:** `read`.'
      operationId: listObjectStorageKeys
      security:
      - apiKey: []
      x-scope: read
      x-order: 459
      parameters:
      - name: region
        in: query
        required: false
        description: The region code, e.g. `af-abj`. Defaults to the region object storage is offered in.
        schema:
          type: string
      responses:
        200:
          description: Access keys.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: This request's id.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectStorageKeyList'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          description: '`INSUFFICIENT_SCOPE`: the API key lacks the scope this endpoint needs. Use a key with that scope.

            `FORBIDDEN`: the member who created the key may not do this in the organization. Use a key created by an owner
            or admin.

            `AI_APPS_DISABLED`: the organization has turned AI app access off. An owner can turn it on in the console under
            Organization › AI apps.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        422:
          description: '`OBJECT_STORAGE_REGION_UNAVAILABLE`: object storage is not offered in this region.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        429:
          $ref: '#/components/responses/RateLimited'
        503:
          description: '`OBJECT_STORAGE_UNAVAILABLE`: object storage is not available right now. Retry shortly.

            `QUOTA_UNAVAILABLE`: request quotas cannot be checked right now. Retry shortly.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - Object storage
      summary: Create an access key
      description: 'Creates an S3 access key for any S3 tool (AWS CLI, rclone, s3cmd, SDKs). The secret is in this response
        only and is never shown again; store it now. A key may be limited to some buckets and to reading. Keys cannot create
        or delete buckets; use this API for that.


        **Idempotency:** a retry is not replayed: it creates another key. If a request may have gone through, list the keys
        and revoke one you did not receive.


        **Scope:** `write`.'
      operationId: createObjectStorageKey
      security:
      - apiKey: []
      x-scope: write
      x-order: 460
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateObjectStorageKeyRequest'
      responses:
        201:
          description: The key, with its secret.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: This request's id.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedObjectStorageKey'
        400:
          description: '`IDEMPOTENCY_KEY_REQUIRED`: the `Idempotency-Key` header is missing. Send a new unique value, such
            as a UUID, with every write.

            `INVALID_IDEMPOTENCY_KEY`: the `Idempotency-Key` header is longer than 255 characters. Use a shorter value.

            `INVALID_REQUEST_BODY`: the body is not a single valid JSON object. Send one JSON object with the fields documented
            for this endpoint.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          description: '`INSUFFICIENT_SCOPE`: the API key lacks the scope this endpoint needs. Use a key with that scope.

            `FORBIDDEN`: the member who created the key may not do this in the organization. Use a key created by an owner
            or admin.

            `AI_APPS_DISABLED`: the organization has turned AI app access off. An owner can turn it on in the console under
            Organization › AI apps.

            `OBJECT_STORAGE_NOT_ENABLED`: object storage is in closed beta and not enabled for your organization yet.

            `OBJECT_STORAGE_KEY_LIMIT_REACHED`: the organization already has the most access keys allowed. Revoke one first.

            `OBJECT_STORAGE_SUSPENDED`: object storage is suspended for this organization.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        409:
          description: '`OBJECT_STORAGE_KEY_NAME_TAKEN`: the organization already has an access key with that name in this
            region.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        422:
          description: '`VALIDATION_FAILED`: `name` must be 1 to 64 letters, digits, `-`, `_` or `.`; name at most 100 `buckets`,
            each once.

            `OBJECT_STORAGE_REGION_UNAVAILABLE`: object storage is not offered in this region.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        429:
          $ref: '#/components/responses/RateLimited'
        503:
          description: '`OBJECT_STORAGE_UNAVAILABLE`: object storage is not available right now. Retry shortly.

            `QUOTA_UNAVAILABLE`: request quotas cannot be checked right now. Retry shortly.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
