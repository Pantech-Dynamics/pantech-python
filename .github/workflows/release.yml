name: Release

# Builds the sdist and wheel for a vX.Y.Z tag and publishes them to PyPI with
# Trusted Publishing (OIDC): no API token is stored anywhere. Runs from
# auto-release.yml, or on a tag pushed by hand.

on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      version:
        description: "The tag to release, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: The tag matches the package version
        shell: bash
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          declared=$(grep -m1 -E '^version = ' pyproject.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          code=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' src/pantech/_version.py)
          if [ "v$declared" != "$TAG" ] || [ "$code" != "$declared" ]; then
            echo "::error::tag $TAG, pyproject.toml $declared and _version.py $code must agree."
            exit 1
          fi
      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-asyncio ruff pyyaml
          pytest -q
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pantech/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release with this version's notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          number="${TAG#v}"
          awk -v v="$number" '
            $0 ~ "^## "v" " {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
